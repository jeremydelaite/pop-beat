  function playNote(){var seq=tunes[ti].notes;play(freq(seq[idx]));idx=(idx+1)%seq.length;}
  function setEmpty(el){el.dataset.state='empty';el.dataset.down='0';el.style.opacity='0';el.style.pointerEvents='none';el.style.transform='';el.style.animation='';}
  function setActive(el){el.dataset.state='active';el.dataset.down='0';el.style.pointerEvents='auto';el.style.opacity='1';paint(el,false);el.style.transform='';el.style.animation='none';void el.offsetWidth;el.style.animation='spawn .2s cubic-bezier(.22,1.5,.5,1)';}
  function spawnOne(){var em=[].filter.call(board.children,function(el){return el.dataset.state==='empty';});if(!em.length)return;setActive(em[Math.floor(Math.random()*em.length)]);}
  function applyModeState(){
    if(mode==='solo'){
      [].forEach.call(board.children,function(el){setEmpty(el);});
      var cells=[].slice.call(board.children);
      for(var k=cells.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var tmp=cells[k];cells[k]=cells[j];cells[j]=tmp;}
      for(var s=0;s<5&&s<cells.length;s++)setActive(cells[s]);
    } else {
      order=[];
      [].forEach.call(board.children,function(el){el.dataset.state='';el.dataset.down='0';el.style.opacity='1';el.style.pointerEvents='auto';el.style.transform='';el.style.animation='';paint(el,false);});
    }
  }
  function setMode(m){mode=m;modeBtn.innerHTML=(m==='solo')?ZAP_ICON:GRID_ICON;try{localStorage.setItem('popit-mode',m);}catch(e){}applyModeState();}
  function resetAll(){idx=0;if(mode==='grid')refillAll();else applyModeState();}
  function onMotion(ev){var a=ev.accelerationIncludingGravity||ev.acceleration;if(!a)return;var m=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));var now=Date.now();if(m>28&&now-lastShake>1200){lastShake=now;if(navigator.vibrate)navigator.vibrate([25,50,25]);resetAll();}}
  function enableMotion(){if(motionOn)return;motionOn=true;try{if(window.DeviceMotionEvent){if(typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(function(s){if(s==='granted')window.addEventListener('devicemotion',onMotion);}).catch(function(){});}else{window.addEventListener('devicemotion',onMotion);}}}catch(e){}}
  function build(){
    board.innerHTML='';
    for(var i=0;i<N*N;i++){
      var b=document.createElement('button');
      b.className='bubble'; b.dataset.down='0'; b.dataset.r=Math.floor(i/N); b.dataset.c=i%N; b.setAttribute('aria-label','bulle');
      paint(b,false);
      b.addEventListener('pointerdown',function(ev){
        ev.preventDefault();
        enableMotion();
        var el=ev.currentTarget;
        if(mode==='solo'){
          if(el.dataset.state!=='active') return;
          el.dataset.state='popping';
          if(navigator.vibrate) navigator.vibrate(18);
          playNote();
          el.dataset.down='1'; paint(el,true); el.style.animation=''; el.style.transform='scale(.85)';
          (function(b2){setTimeout(function(){setEmpty(b2);},100);})(el);
          spawnOne();
          return;
        }
        if(locked) return;
        if(el.dataset.down==='1') return;
        el.dataset.down='1'; paint(el,true);
        el.style.animation=''; el.style.transform='scale(.88)';
        if(navigator.vibrate) navigator.vibrate(18);
        playNote();
        order.push(el); ensureMin(el);
      });
      board.appendChild(b);
    }
  }
  try{var savedM=localStorage.getItem('popit-tune');if(savedM!==null&&tunes[+savedM]){ti=+savedM;ddTune.setCur(ti);}}catch(e){}
  modeBtn.onclick=function(){setMode(mode==='grid'?'solo':'grid');};
  build();
  var savedMode='grid'; try{if(localStorage.getItem('popit-mode')==='solo')savedMode='solo';}catch(e){}
  setMode(savedMode);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
